<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy: only this site's own scripts, styles, images and workers. 'unsafe-inline' styles: the inline <style> below and Phaser's canvas sizing. (frame-ancestors can't be set from a meta tag; see docs/SECURITY.md.) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Share tile (Open Graph + Twitter card): static and absolute, since crawlers don't run JS. This build is served at /panel/; the image is the world build's title screen (made by `npm run og` on the world branch). -->
    <meta name="description" content="Run a CNC router in a Melbourne shed. Keep it cutting, keep the margin, don't burn the place down." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keep It Running" />
    <meta property="og:title" content="Keep It Running" />
    <meta property="og:description" content="Run a CNC router in a Melbourne shed. Keep it cutting, keep the margin, don't burn the place down." />
    <meta property="og:url" content="https://keepitrunning.fyi/panel/" />
    <meta property="og:image" content="https://keepitrunning.fyi/panel/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keep It Running title screen: a pixel-art CNC shed" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keep It Running" />
    <meta name="twitter:description" content="Run a CNC router in a Melbourne shed. Keep it cutting, keep the margin, don't burn the place down." />
    <meta name="twitter:image" content="https://keepitrunning.fyi/panel/og-image.png" />
    <title>Keep It Running</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; background: #14110f; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

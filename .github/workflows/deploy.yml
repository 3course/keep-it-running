name: Deploy to GitHub Pages

# One site at https://keepitrunning.fyi/ (custom domain set in repo Settings → Pages; a CNAME file isn't needed when
# Pages deploys from Actions), two builds:
#   - the world branch (the 3D game) at the root
#   - the main branch (the panel prototype) at /panel/
#   - /preview/, where the 3D build used to live, redirects to the root (world's public/preview/ and public/404.html)
# Both branches are checked out and built on every push to either, and deployed together as one artifact, so a push to
# one never wipes the other. This file must be the same on main and world.

on:
  push:
    branches: [main, world]
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it asks for more (only deploy does).
# Third-party actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
# Triggers are push and manual only: never pull_request_target, so fork PRs can't run with secrets or a write token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: world
          path: world
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            world/package-lock.json

      - name: Build main (panel prototype, /panel/)
        working-directory: main
        env:
          VITE_BASE: /panel/
        run: |
          npm ci
          npm run build

      - name: Build world (the 3D game, at the root)
        working-directory: world
        env:
          VITE_BASE: /
        run: |
          npm ci
          npm run build

      - name: Combine
        run: |
          mkdir -p site/panel
          cp -r world/dist/. site/
          cp -r main/dist/. site/panel/
          test -f site/preview/index.html # the redirect for old /preview/ links ships in the world build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write    # to publish the Pages site
      id-token: write # to prove to Pages that this run is who it says it is (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

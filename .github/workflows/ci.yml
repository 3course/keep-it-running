name: CI

# Checks pull requests: typecheck and the full test suite. It never deploys and never blocks a deploy (that's
# deploy.yml, the same file on main and world). This file lives on world, so it runs for PRs into world and into
# branches made from it (a review follow-up into a Cursor branch, say); PRs into main don't carry it.
# No lint: typescript-eslint doesn't support TypeScript 7 yet (see docs/REVIEW.md).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # the spec reporter ends with a list of what failed, so a red run is readable from the tail of the log
      - run: node --test --test-reporter=spec tests/*.test.mjs

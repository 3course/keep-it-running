name: CI

# Checks every pull request into `world` (Cursor's, Claude's, Dependabot's): typecheck and the full test suite. It
# never deploys and never blocks a deploy (that's deploy.yml, the same file on main and world). Not for PRs into
# `main`: this file only lives on world, and main has no test script.
# No lint: typescript-eslint doesn't support TypeScript 7 yet (see docs/REVIEW.md).
on:
  pull_request:
    branches: [world]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
